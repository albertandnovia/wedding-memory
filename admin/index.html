<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wedding Memories Admin</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="admin-shell">

    <section class="login-card" id="loginCard">
      <p class="eyebrow">Albert & Novia</p>

      <h1>Wedding Memories</h1>

      <p class="login-intro">
        Enter the admin password to view the gallery.
      </p>

      <form id="loginForm">
        <input
          id="adminPassword"
          type="password"
          placeholder="Admin password"
          autocomplete="current-password"
          required
        />

        <button
          class="login-button"
          type="submit"
        >
          Open Gallery
        </button>
      </form>

      <p
        class="login-error"
        id="loginError"
        hidden
      >
        Incorrect password.
      </p>
    </section>


    <section
      class="gallery-app"
      id="galleryApp"
      hidden
    >

      <header class="admin-header">
        <div>
          <p class="eyebrow">Albert & Novia</p>
          <h1>Wedding Memories</h1>
        </div>

        <div class="admin-actions">
          <button
            id="refreshButton"
            type="button"
          >
            Refresh
          </button>

          <button
            id="logoutButton"
            type="button"
          >
            Log Out
          </button>
        </div>
      </header>

      <section class="stats">
        <p>
          <strong id="photoCount">0</strong>
          photos collected
        </p>
      </section>

      <section
        class="gallery"
        id="gallery"
        aria-live="polite"
      >
        <p class="loading">
          Loading memories...
        </p>
      </section>

    </section>

  </main>


  <div
    class="lightbox"
    id="lightbox"
    hidden
  >
    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close photo"
    >
      ×
    </button>

    <img
      id="lightboxImage"
      alt="Wedding memory"
    />
  </div>


  <script src="admin.js"></script>

</body>
</html>

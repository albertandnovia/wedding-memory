<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wedding Memories</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="page-shell">
    <section class="hero-card">
      <div class="heart" aria-hidden="true">❤</div>

      <p class="eyebrow">Albert & Novia</p>

      <h1>Capture Our Day Through Your Eyes</h1>

      <p class="intro">
        Every smile, every laugh, and every little moment you capture
        becomes a memory we’ll treasure forever.
      </p>

    <div class="actions">
  <button
  class="primary-button"
  id="nativeCameraButton"
  type="button"
>
  <span class="button-icon">📷</span>
  Take a Photo
</button>

<button
  class="secondary-button"
  id="uploadPhotoButton"
  type="button"
>
  <span class="button-icon">🖼️</span>
  Choose a Photo
</button>

  <input
    type="file"
    id="galleryInput"
    accept="image/*"
    multiple
    hidden
  />

  <input
    type="file"
    id="nativeCameraInput"
    accept="image/*"
    capture="environment"
    hidden
  />
</div>

<div class="camera-screen" id="cameraScreen" hidden>
  <video id="cameraPreview" autoplay playsinline></video>

  <div class="camera-controls">
    <button class="capture-button" id="captureButton" type="button">
      <span></span>
    </button>

    <button class="close-camera-button" id="closeCameraButton" type="button">
      Close
    </button>
  </div>
</div>

<canvas id="photoCanvas" hidden></canvas>

<div class="photo-preview" id="photoPreview" hidden>
  <img id="previewImage" alt="Your captured wedding memory" />

  <div class="preview-actions">
    <button class="primary-button" id="retakeButton" type="button">
      Retake
    </button>

    <button class="secondary-button" id="usePhotoButton" type="button">
      Use This Photo
    </button>
  </div>
</div>

<div class="upload-success" id="uploadSuccess" hidden>
  <div class="success-icon">✓</div>

  <h2>Memory Saved</h2>

  <p>
    Your photo has been safely added to our wedding memories.
  </p>

  <button
    class="primary-button"
    id="uploadAnotherButton"
    type="button"
  >
    Upload Another Photo
  </button>
</div>

      <p class="privacy-note">
        Your photos will only be shared with the bride and groom.
      </p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

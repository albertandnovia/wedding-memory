<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wedding Memories</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="page-shell">
    <section class="hero-card">
      <div class="heart" aria-hidden="true">❤</div>

      <p class="eyebrow">Albert & Novia</p>

      <h1>Capture Our Day Through Your Eyes</h1>

      <p class="intro">
        Every smile, every laugh, and every little moment you capture
        becomes a memory we’ll treasure forever.
      </p>

      <div class="actions">
        <button class="primary-button" id="takePhotoButton" type="button">
          <span class="button-icon">📷</span>
          Take a Photo
        </button>

        <button class="secondary-button" id="uploadPhotoButton" type="button">
          <span class="button-icon">🖼️</span>
          Upload from Gallery
        </button>
      </div>

      <p class="privacy-note">
        Your photos will only be shared with the bride and groom.
      </p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
